<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streakwise Habit Tracker</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b6e6e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Streakwise">
<style>
:root{--bg:#f2f5f7;--cd:#fff;--tx:#14202b;--mu:#566472;--ln:#dde3e8;--ac:#0b6e6e;--on:#fff;--h0:#e3e9ed;--ok:#0b7a4b;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f161c;--cd:#18222b;--tx:#eaf0f4;--mu:#9fb0bd;--ln:#2a3945;--ac:#4fd1c5;--on:#06201e;--h0:#26333d;--ok:#5fd49b;--bad:#ff8a7a}}
:root[data-theme=dark]{--bg:#0f161c;--cd:#18222b;--tx:#eaf0f4;--mu:#9fb0bd;--ln:#2a3945;--ac:#4fd1c5;--on:#06201e;--h0:#26333d;--ok:#5fd49b;--bad:#ff8a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",Avenir,"Segoe UI",Roboto,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:16px 16px 100px;animation:in .22s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.02em;margin:2px 0 14px}h2{font-size:18px;margin:20px 0 8px}
.mu{color:var(--mu);font-size:14px}.c{text-align:center}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd{display:flex;justify-content:space-between;align-items:flex-start}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.ib{min-width:44px;min-height:44px;border:0;background:transparent;font-size:20px;border-radius:12px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--ln);background:var(--cd);font-weight:600;width:100%;margin-top:8px}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}.btn.d{color:var(--bad);border-color:var(--bad)}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em}
.bar{height:14px;background:var(--h0);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.hc{display:flex;gap:12px;align-items:center;border-left:6px solid var(--c)}
.hc .ic{font-size:28px;width:44px;text-align:center}.hc .bd{flex:1;min-width:0;cursor:pointer}
.hc .ac{display:flex;flex-direction:column;align-items:center}
.stt{font-weight:600;font-size:14px;margin-top:2px}.done .stt{color:var(--ok)}
.ck{width:52px;height:52px;border-radius:50%;border:3px solid var(--c);background:transparent;font-size:26px;font-weight:700;color:var(--on);transition:transform .15s}
.ck.on{background:var(--c);animation:pop .3s}@keyframes pop{50%{transform:scale(1.2)}}
.stp{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:14px}
.sb{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);font-size:20px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--cd)}
nav button{flex:1;min-height:60px;border:0;background:transparent;font-size:12px;color:var(--mu)}
nav button b{display:block;font-size:20px;font-weight:400}nav .on{color:var(--ac);font-weight:700}
.fab{position:fixed;bottom:84px;right:max(16px,calc(50% - 264px));width:60px;height:60px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:30px;box-shadow:0 6px 18px #0004}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--ln);background:var(--cd)}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--c)}.sw.on{border-color:var(--tx)}
.ig{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.ig button{min-height:44px;border-radius:10px;border:1px solid transparent;background:transparent;font-size:22px}.ig .on{border-color:var(--ac);background:var(--h0)}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--cd)}
textarea{min-height:160px;font:12px/1.3 monospace}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .dn{font-size:12px;color:var(--mu)}
.dc{min-height:44px;border-radius:10px;border:2px solid transparent;background:var(--h0);font-size:13px;padding:2px}
.dc.full{background:var(--ac);color:var(--on);font-weight:700}.dc.part{background:color-mix(in srgb,var(--ac) 35%,var(--h0))}
.dc.miss{color:var(--bad)}.dc.fu{background:transparent;color:var(--mu);opacity:.6}.dc.sel{border-color:var(--tx)}.dc small{display:block;font-size:11px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiles .card{margin:0}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:11px}.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.hm i{aspect-ratio:1;border-radius:3px;background:var(--h0);position:relative}.hm i:after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--ac);opacity:var(--o,0)}
.pb{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}.pb span:first-child{width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pb .bar{flex:1;margin:0;height:10px}
.empty{text-align:center;padding:36px 12px}.empty .e{font-size:48px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--cd);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;max-height:88%;overflow:auto}
#toast{position:fixed;left:16px;right:16px;bottom:96px;margin:auto;max-width:520px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:10;display:none}
.ob{display:flex;flex-direction:column;justify-content:center;min-height:100%;text-align:center}.ob .e{font-size:72px}
.splash{display:flex;height:100%;align-items:center;justify-content:center;font-size:32px;font-weight:700;letter-spacing:-.03em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const add=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const today=()=>key(new Date()),dow=k=>parse(k).getDay();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DK=/^\d{4}-\d{2}-\d{2}$/,SK='streakwise.v1',DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ICONS=['🏃','📚','💧','🧘','💪','🥗','😴','✍️','💻','🎸','🚶','🚴','🧹','💰','🌱','⭐'];
const CATS=['Health','Fitness','Study','Work','Personal','Finance','Other'];
const COLS=['#0b6e6e','#2563eb','#7c3aed','#c026d3','#dc2626','#d97706','#16a34a','#475569'];
const blank=()=>({habits:[],logs:{},prefs:{theme:'auto',ws:1,name:'',onb:false}});
function sanitize(o){
 if(!o||typeof o!=='object'||!Array.isArray(o.habits))return null;
 const habits=o.habits.filter(h=>h&&typeof h.id==='string'&&!h.id.includes('|')&&typeof h.name==='string'&&h.name.trim()&&DK.test(h.start)).map(h=>({id:h.id,name:h.name.slice(0,60),desc:String(h.desc||'').slice(0,120),icon:String(h.icon||'⭐').slice(0,4),color:/^#[0-9a-f]{6}$/i.test(h.color)?h.color:COLS[0],cat:CATS.includes(h.cat)?h.cat:'Other',goal:['bool','count','duration','distance'].includes(h.goal)?h.goal:'bool',target:Math.max(.5,+h.target||1),unit:String(h.unit||'').slice(0,12),freq:['daily','days','week','month'].includes(h.freq)?h.freq:'daily',days:(Array.isArray(h.days)?h.days:[]).filter(x=>x>=0&&x<=6),n:Math.max(1,Math.min(31,+h.n||1)),start:h.start,remOn:!!h.remOn,rem:(Array.isArray(h.rem)?h.rem:[]).filter(t=>/^\d{2}:\d{2}$/.test(t)),status:['active','paused','archived'].includes(h.status)?h.status:'active',pauses:(Array.isArray(h.pauses)?h.pauses:[]).filter(p=>Array.isArray(p)&&DK.test(p[0])&&(!p[1]||DK.test(p[1]))).map(p=>[p[0],p[1]||null])}));
 const ids=new Set(habits.map(h=>h.id)),logs={};
 for(const k in(o.logs||{})){const[id,d]=k.split('|'),l=o.logs[k];if(ids.has(id)&&DK.test(d)&&l&&['done','rest','part'].includes(l.s))logs[k]={s:l.s,v:+l.v||0}}
 const p=o.prefs||{};
 return{habits,logs,prefs:{theme:['auto','light','dark'].includes(p.theme)?p.theme:'auto',ws:p.ws===0?0:1,name:String(p.name||'').slice(0,30),onb:!!p.onb}}}
const DBN='streakwise',storeInfo={mode:'starting',persistent:null};let db=null,S=blank();const snap=new Map();
const openDB=()=>new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('habits',{keyPath:'id'});d.createObjectStore('logs',{keyPath:'k'});d.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
const idbAll=st=>new Promise((res,rej)=>{const q=db.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const legacyLoad=()=>{try{const r=localStorage.getItem(SK);return r?sanitize(JSON.parse(r)):null}catch(e){return null}};
async function boot(){
 try{db=await openDB();const[hs,ls,ms]=await Promise.all([idbAll('habits'),idbAll('logs'),idbAll('meta')]),pr=ms.find(m=>m.k==='prefs');
  if(pr){const lg={};ls.forEach(l=>lg[l.k]={s:l.s,v:l.v});S=sanitize({habits:hs,logs:lg,prefs:pr.val})||blank();for(const k in S.logs)snap.set(k,JSON.stringify(S.logs[k]))}
  else S=legacyLoad()||blank(); /* first run, or one-time migration from the old localStorage version */
  storeInfo.mode='indexeddb';if(!pr)save();
  navigator.storage?.persist?.().then(p=>{storeInfo.persistent=p}).catch(()=>{})}
 catch(e){db=null;S=legacyLoad()||blank();storeInfo.mode='localStorage fallback (IndexedDB unavailable)'}}
function save(){
 if(!db){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){toast('Could not save: browser storage is blocked or full.')}return}
 try{const tx=db.transaction(['habits','logs','meta'],'readwrite'),hS=tx.objectStore('habits'),lS=tx.objectStore('logs'),mS=tx.objectStore('meta');
  hS.clear();S.habits.forEach(h=>hS.put(h));mS.put({k:'prefs',val:S.prefs});
  const seen=new Set();
  for(const k in S.logs){seen.add(k);const j=JSON.stringify(S.logs[k]);if(snap.get(k)!==j){lS.put({k,...S.logs[k]});snap.set(k,j)}}
  for(const k of[...snap.keys()])if(!seen.has(k)){lS.delete(k);snap.delete(k)}
  tx.onabort=tx.onerror=()=>{snap.clear();toast('Could not save to IndexedDB. Export a backup.',5000)}}
 catch(e){toast('Could not save to IndexedDB. Export a backup.',5000)}}
let tt;function toast(m,ms=3000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms)}

/* ---- schedule + streak logic (all derived from completion records) ---- */
const L=(h,d)=>S.logs[h.id+'|'+d],isDone=(h,d)=>L(h,d)?.s==='done',isRest=(h,d)=>L(h,d)?.s==='rest';
const paused=(h,d)=>h.pauses.some(p=>d>=p[0]&&(!p[1]||d<p[1])),per=h=>h.freq==='week'||h.freq==='month';
const dueDay=(h,d)=>d>=h.start&&!paused(h,d)&&(h.freq==='daily'||(h.freq==='days'&&h.days.includes(dow(d))));
const pStart=(f,d)=>f==='month'?d.slice(0,8)+'01':add(d,-((dow(d)-S.prefs.ws+7)%7));
const pNext=(f,s)=>{if(f==='month'){const x=parse(s);return key(new Date(x.getFullYear(),x.getMonth()+1,1))}return add(s,7)};
function pCount(h,s){let c=0;const e=pNext(h.freq,s),T=today();for(let d=s;d<e&&d<=T;d=add(d,1))if(d>=h.start&&isDone(h,d))c++;return c}
function streaks(h){
 const T=today();let run=0,best=0;
 if(!per(h)){for(let d=h.start;d<=T;d=add(d,1)){if(isDone(h,d)){run++;best=Math.max(best,run)}else if(dueDay(h,d)&&!isRest(h,d)&&d<T)run=0}}
 else{const cs=pStart(h.freq,T);for(let s=pStart(h.freq,h.start);s<=cs;s=pNext(h.freq,s)){if(pCount(h,s)>=h.n){run++;best=Math.max(best,run)}else if(s<cs)run=0}}
 return{cur:run,best}}
function totalDone(h){const T=today();let c=0;for(const k in S.logs)if(k.startsWith(h.id+'|')&&S.logs[k].s==='done'&&k.slice(-10)<=T)c++;return c}
function rate(h){const T=today();let ok=0,tot=0;
 if(!per(h)){for(let d=h.start;d<=T;d=add(d,1)){if(isRest(h,d))continue;if(isDone(h,d)){ok++;tot++}else if(dueDay(h,d)&&d<T)tot++}}
 else{const cs=pStart(h.freq,T);for(let s=pStart(h.freq,h.start);s<=cs;s=pNext(h.freq,s)){const m=pCount(h,s)>=h.n;if(s<cs||m){tot++;if(m)ok++}}}
 return tot?Math.round(ok/tot*100):0}
function dayStat(d){const done=[],missed=[],rest=[],T=today();
 for(const h of S.habits){if(d<h.start||d>T&&0)continue;if(isDone(h,d))done.push(h);else if(isRest(h,d))rest.push(h);else if(h.status!=='archived'&&!per(h)&&dueDay(h,d)&&d<T)missed.push(h)}
 const t=done.length+missed.length;return{done,missed,rest,pct:t?Math.round(done.length/t*100):null}}
const unit=h=>h.goal==='duration'?'min':h.goal==='distance'?'km':(h.unit||'times');
const step=h=>h.goal==='count'?1:h.goal==='distance'?.5:(h.target>=60?10:5);
const todayList=()=>{const T=today();return S.habits.filter(h=>h.status==='active'&&(dueDay(h,T)||(per(h)&&T>=h.start&&(isDone(h,T)||pCount(h,pStart(h.freq,T))<h.n))))};
function badges(h){const s=streaks(h),u=per(h)?(h.freq==='week'?'week':'month'):'day',b=[];
 [7,30,100].forEach(n=>{if(s.best>=n)b.push('🔥 '+n+' '+u+' streak')});if(totalDone(h)>=100)b.push('🏆 100 completions');return b}
function periodProg(h,a,z){let done=0,goal=0;const T=today();for(let d=a;d<=z;d=add(d,1)){if(d>T&&0)break;if(d<=T&&isDone(h,d))done++;if(!per(h)&&dueDay(h,d))goal++}
 if(per(h)){const days=(parse(z)-parse(a))/864e5+1;goal=h.freq==='week'?h.n*Math.ceil(days/7):h.n*Math.ceil(days/31)}return{done,goal}}

/* ---- actions ---- */
function setDone(h,d,on){if(d>today())return toast('Future dates can’t be completed.');const k=h.id+'|'+d;
 if(on){S.logs[k]={s:'done',v:h.target};const s=streaks(h),u=per(h)?h.freq:'day';if([7,30,100,365].includes(s.cur))toast('🔥 '+s.cur+'-'+u+' streak!');else if(totalDone(h)===100)toast('🏆 100 completions!')}else delete S.logs[k];save()}
function bump(h,d,dir){const k=h.id+'|'+d,l=S.logs[k]||{v:0};let v=Math.max(0,+((l.v||0)+dir*step(h)).toFixed(2));
 if(v>=h.target)setDone(h,d,true);else{if(v>0)S.logs[k]={s:'part',v};else delete S.logs[k];save()}}
function toggleRest(h,d){const k=h.id+'|'+d;if(isRest(h,d)){delete S.logs[k];return save()}
 if(d>today())return toast('Rest days apply to today or past dates.');const ws=pStart('week',d);let c=0;for(let x=ws;x<add(ws,7);x=add(x,1))if(isRest(h,x))c++;
 if(c>=2)return toast('Rest-day limit reached: 2 per week for each habit.');S.logs[k]={s:'rest',v:0};save()}
let fired={};
function notify(h){const t=h.icon+' Time for '+h.name,b='Don’t forget your '+h.name+' habit.';try{if('Notification' in window&&Notification.permission==='granted'){new Notification(t,{body:b});return}}catch(e){}toast(t+' — '+b,7000)}
function tick(){const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),T=today();
 for(const h of S.habits){if(h.status!=='active'||!h.remOn||!h.rem.includes(hm))continue;const f=h.id+hm+T;if(fired[f])continue;fired[f]=1;if(isDone(h,T)||(!per(h)&&!dueDay(h,T)))continue;notify(h)}}
setInterval(tick,15000);
async function askPerm(){if(!('Notification' in window))return toast('System notifications aren’t available here. Reminders will appear in the app while it’s open.',5000);
 try{if(Notification.permission==='default')await Notification.requestPermission()}catch(e){}
 if(Notification.permission==='denied')toast('Notifications are blocked. Reminders will appear in the app while it’s open.',5000)}

/* ---- UI state + views ---- */
const ui={tab:'today',view:null,cal:{m:today().slice(0,8)+'01',sel:today()},dm:today().slice(0,8)+'01',draft:null,modal:null,ob:0,splash:true};
const empty=(e,t,m,b)=>`<div class=empty><div class=e>${e}</div><h2>${t}</h2><p class=mu>${m}</p>${b?`<button class="btn p" data-a=add>${b}</button>`:''}</div>`;
const prog=p=>`<div class=bar role=progressbar aria-valuenow=${p} aria-valuemin=0 aria-valuemax=100 aria-label="Progress ${p} percent"><i style="width:${p}%"></i></div>`;
function card(h){const T=today(),d=isDone(h,T),r=isRest(h,T),l=L(h,T),st=streaks(h),u=per(h)?h.freq:'day';
 const status=d?'✓ Completed':r?'— Rest day':l&&l.s==='part'?'◐ In progress':'○ Not done';
 const pc=per(h)?` · ${pCount(h,pStart(h.freq,T))}/${h.n} this ${h.freq}`:'';
 const sp=h.goal!=='bool'&&!d&&!r?`<div class=stp><button class=sb data-a=bump data-id=${h.id} data-v=-1 aria-label="Decrease ${esc(h.name)}">−</button><span>${l?l.v:0} / ${h.target} ${esc(unit(h))}</span><button class=sb data-a=bump data-id=${h.id} data-v=1 aria-label="Increase ${esc(h.name)}">+</button></div>`:'';
 return `<article class="card hc ${d?'done':''}" style="--c:${h.color}"><div class=ic aria-hidden=true>${h.icon}</div><div class=bd data-a=open data-id=${h.id} role=button tabindex=0><b>${esc(h.name)}</b>${h.desc?`<div class=mu>${esc(h.desc)}</div>`:''}<div class=mu>🔥 ${st.cur} ${u} streak${pc}</div><div class=stt>${status}</div>${sp}</div><div class=ac><button class="ck ${d?'on':''}" data-a=toggle data-id=${h.id} aria-pressed=${d} aria-label="${d?'Undo completion of':'Complete'} ${esc(h.name)}">${d?'✓':''}</button><button class=ib data-a=rest data-id=${h.id} title="Rest day" aria-label="${r?'Remove rest day for':'Mark rest day for'} ${esc(h.name)}">${r?'↩':'🛌'}</button></div></article>`}
function vToday(){const T=today(),hs=todayList(),dn=hs.filter(h=>isDone(h,T)).length,p=hs.length?Math.round(dn/hs.length*100):0,g=new Date().getHours();
 const gr=g<12?'Good morning':g<18?'Good afternoon':'Good evening';
 return `<div class=hd><div><div class=mu>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>${gr}${S.prefs.name?', '+esc(S.prefs.name):''}</h1></div><button class=ib data-a=tab data-v=settings aria-label="Profile and settings">👤</button></div>
 <section class=card><div class=row><b>Today’s progress</b><span class=big>${p}%</span></div>${prog(p)}<div class=mu>${dn} / ${hs.length} habits completed</div></section>

 case'reset':S.logs={};save();ui.modal=null;toast('Statistics reset.');break;

 case'priv':ui.modal={t:'Privacy',b:'<p>Your data stays in IndexedDB storage on this device. Nothing is sent to a server. Export a backup before clearing browser data.</p>'};break;
 case'obnext':if(ui.ob<2){ui.ob++}else{S.prefs.onb=true;save();ui.draft=newDraft();ui.view={t:'form'}}break;
 case'obskip':S.prefs.onb=true;save();break}
 render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){if(t.dataset.a==='closem'&&e.target.closest('.modal>div')&&!e.target.closest('button'))return;act(t.dataset.a,t.dataset.v,t.dataset.id,t)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'&&e.target.dataset.a){e.preventDefault();act(e.target.dataset.a,e.target.dataset.v,e.target.dataset.id,e.target)}});
document.addEventListener('input',e=>{const f=e.target.dataset.f,p=e.target.dataset.p;if(p){S.prefs[p]=e.target.value;save()}else if(f&&ui.draft&&e.target.matches('input'))ui.draft[f]=e.target.type==='number'?e.target.value:e.target.value});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
document.addEventListener('change',e=>{if(e.target.id==='imf'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('#im').value=r.result};r.readAsText(e.target.files[0])}});
render();Promise.all([boot(),new Promise(r=>setTimeout(r,900))]).then(()=>{ui.splash=false;render()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
